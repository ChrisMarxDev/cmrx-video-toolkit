name: Desktop playground
on:
  pull_request:
    paths: ['apps/desktop/**', 'apps/local-editor/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/local-editor/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap
      - run: make desktop-install desktop-check
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Archive tagged public source
        env:
          DESKTOP_TAG: ${{ github.ref_name }}
          DESKTOP_RELEASE_DIR: ${{ runner.temp }}/desktop-release
        run: make desktop-release-source TAG="$DESKTOP_TAG"
      - name: Prepare draft source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$DESKTOP_TAG"
          "$RUNNER_TEMP"/desktop-release/*
          --verify-tag --draft --prerelease
          --title "Desktop ${DESKTOP_TAG#desktop-v} · developer preview"
          --notes-file apps/desktop/RELEASE_NOTES.md
