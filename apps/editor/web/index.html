<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Video Review</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="notifications">
      <div id="job" role="status" hidden>
        <span id="job-text"></span><button id="cancel" hidden>Cancel</button
        ><button id="retry" hidden>Retry</button>
      </div>
      <div id="error" role="alert" hidden></div>
      <div id="export-result" role="status" hidden></div>
    </div>
    <main id="empty">
      <h1>Review a video</h1>
      <p>Select a moment. Leave a comment.</p>
      <button id="begin">Open video</button>
    </main>
    <main id="editor" hidden>
      <section class="viewer-panel" aria-label="Video and timeline">
        <div class="video-shell">
          <video id="video" preload="metadata" playsinline></video>
        </div>
        <section class="timeline-panel" aria-label="Timeline">
          <div class="video-meta">
            <span id="source-name"></span>
            <output id="position">0:00</output>
            <button
              id="expand-timeline"
              class="icon"
              aria-label="Expand timeline"
              title="Expand timeline"
              aria-expanded="false"
              aria-controls="timeline-scroll"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  class="expand-glyph"
                  d="m8 8 4-4 4 4M12 4v6m-4 6 4 4 4-4m-4 4v-6"
                />
                <path
                  class="collapse-glyph"
                  d="m8 4 4 4 4-4M12 2v6m-4 12 4-4 4 4m-4 2v-6"
                />
              </svg>
            </button>
          </div>
          <div class="timeline-surface">
            <input
              id="seek"
              aria-label="Playback position"
              type="range"
              min="0"
              value="0"
              step="0.01"
            />
            <div id="timeline-scroll">
              <div id="timeline" aria-label="Comment timeline"></div>
            </div>
            <div class="playhead-track" aria-hidden="true">
              <div id="timeline-playhead"></div>
            </div>
          </div>
        </section>
      </section>
      <aside>
        <div class="transcript-heading">
          <h2>Transcript</h2>
          <span id="save-status" role="status"></span>
        </div>
        <input
          id="search"
          type="search"
          placeholder="Search transcript"
          aria-label="Search transcript"
        />
        <div id="transcript"></div>
      </aside>
    </main>
    <section
      id="comment-popover"
      role="dialog"
      aria-label="Edit comment"
      hidden
    >
      <div class="popover-heading">
        <span id="comment-time"></span
        ><button
          id="close-comment"
          class="icon"
          aria-label="Close comment (Escape)"
          title="Close comment (Escape)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </div>
      <textarea
        id="item-text"
        aria-label="Comment"
        placeholder="Add a comment…"
        rows="2"
      ></textarea>
      <div class="popover-actions">
        <button
          id="positive"
          class="icon positive"
          aria-label="Keep"
          title="Keep"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 10v11H3V10h4Zm0 0 5-8c2 0 3 2 2 5l-1 3h6a2 2 0 0 1 2 2l-2 7a3 3 0 0 1-3 2H7"
            />
          </svg></button
        ><button
          id="negative"
          class="icon negative"
          aria-label="Cut"
          title="Cut"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 10v11H3V10h4Zm0 0 5-8c2 0 3 2 2 5l-1 3h6a2 2 0 0 1 2 2l-2 7a3 3 0 0 1-3 2H7"
              transform="rotate(180 12 12)"
            />
          </svg></button
        ><span class="spacer"></span
        ><button
          id="delete"
          class="icon"
          aria-label="Delete comment"
          title="Delete comment"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6" />
          </svg>
        </button>
      </div>
    </section>
    <nav class="action-bar" aria-label="Video actions" hidden>
      <button
        id="open-button"
        class="icon"
        aria-label="Open video"
        title="Open video"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7h6l2 2h10l-3 11H3z" />
          <path d="M3 7V4h7l2 3h7v2" />
        </svg></button
      ><span class="divider"></span
      ><button
        id="undo"
        class="icon"
        aria-label="Undo (Ctrl/Cmd+Z)"
        title="Undo (Ctrl/Cmd+Z)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14"
            transform="translate(0 -2)"
          />
        </svg></button
      ><button
        id="play"
        class="icon primary"
        aria-label="Play (Space)"
        title="Play (Space)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 5 11 7-11 7z" />
        </svg></button
      ><button
        id="redo"
        class="icon"
        aria-label="Redo (Ctrl/Cmd+Shift+Z)"
        title="Redo (Ctrl/Cmd+Shift+Z)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="m16 4 5 5-5 5m5-5H11a7 7 0 0 0 0 14"
            transform="translate(0 -2)"
          />
        </svg></button
      ><span class="divider"></span
      ><button
        id="export-button"
        class="icon"
        aria-label="Export review"
        title="Export review"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V3m-5 5 5-5 5 5M4 14v7h16v-7" />
        </svg>
      </button>
    </nav>
    <dialog id="open-dialog">
      <form id="open-form">
        <h2>Open video</h2>
        <p>Your review saves automatically.</p>
        <label for="video-file">Choose a video</label>
        <input
          type="file"
          id="video-file"
          accept="video/*,.mkv,.mov,.avi,.webm"
        />
        <label
          >Or paste a video or saved review path
          <input id="path" placeholder="Video file or review.json" />
        </label>
        <details>
          <summary>Preparation options</summary>
          <label
            >Project folder (optional)<input
              id="workspace-path"
              placeholder="Defaults to a folder beside the video" /></label
          ><label
            >whisper.cpp model path<input
              id="model-path"
              placeholder="Uses saved model or WHISPER_MODEL" /></label
          ><label
            >Existing transcript path (optional)<input
              id="transcript-path"
              placeholder="Whisper JSON or review.json" /></label
          ><label
            >Relink missing original (opening review.json)<input
              id="relink-path"
              placeholder="New path to the same recording"
          /></label>
        </details>
        <div class="actions">
          <button type="button" id="close-open">Cancel</button
          ><button type="submit" id="prepare">Open video</button>
        </div>
      </form>
    </dialog>
    <dialog id="export-dialog">
      <form id="export-form">
        <h2>Export review</h2>
        <p>
          Save comments, keep/cut guidance, and the timed transcript for the
          composing agent.
        </p>
        <label
          ><input type="checkbox" id="render-cut" /> Include a rough-cut video
          and audio</label
        >
        <p class="muted">Timing is guidance. The agent can refine the edit.</p>
        <div class="actions">
          <button type="button" id="close-export">Cancel</button
          ><button type="submit">Export</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
