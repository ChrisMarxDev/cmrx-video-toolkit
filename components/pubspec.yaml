name: video_components
description: Reusable video components, technical drawings and ordered dithering.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  fluvie: 0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - components.json
  shaders:
    - shaders/camera_frame.frag
    - shaders/dither_field.frag
    - shaders/dither_image.frag
    - shaders/sculpture.frag
