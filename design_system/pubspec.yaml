name: video_components
description: Reusable video components, technical drawings and ordered dithering.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  fluvie: 0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - components.json
  shaders:
    - shaders/dither_field.frag
    - shaders/dither_image.frag
    - shaders/sculpture.frag
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
